<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="backscreen" id="back"></div>

    <div class="menu" id="menu">
        ≡
    </div>

    <div class="instructions" id="instructions"></div>

    <div class="screen" id="screen">
        <div class="menu" id="close">
            ✕
        </div>
        <div>
            <div class="selection">
                <div class="increment" id="minus">-</div>
                <div>💣</div>
                <div class="increment" id="plus">+</div>
            </div>
            <div id="bomb_count">X</div>
        </div>
    </div>

    <div class="board">
        <div class="row">
            <div class="tile">
                <div class="mine" id="0"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="1"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="2"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="3"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="4"></div>
                <div class="cover"></div>
            </div>
        </div>
        <div class="row">
            <div class="tile">
                <div class="mine" id="5"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="6"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="7"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="8"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="9"></div>
                <div class="cover"></div>
            </div>
        </div>
        <div class="row">
            <div class="tile">
                <div class="mine" id="10"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="11"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="12"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="13"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="14"></div>
                <div class="cover"></div>
            </div>
        </div>
        <div class="row">
            <div class="tile">
                <div class="mine" id="15"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="16"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="17"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="18"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="19"></div>
                <div class="cover"></div>
            </div>
        </div>
        <div class="row">
            <div class="tile">
                <div class="mine" id="20"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="21"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="22"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="23"></div>
                <div class="cover"></div>
            </div>
            <div class="tile">
                <div class="mine" id="24"></div>
                <div class="cover"></div>
            </div>
        </div>
    </div>

    <script>
        
        const tiles = 25;
        let numBombs = 3;

        let clears;
        let bombs;
        let cleared;
        let lose;
        let win;

        const screen = document.getElementById('screen');
        const instructions = document.getElementById('instructions');

        setTimeout(() => {
            play();
        }, 550);
        

        function setTable() {
            clears = 0;
            bombs = [];
            cleared = [];
            lose = false;
            win = false;

            instructions.innerText = "";

            for (let i = 0; i < numBombs; i++) {
                let location;
                do {
                    location = Math.floor(Math.random() * 25);
                } while (bombs.includes(location));
                bombs[i] = location;
            }
        }

        document.getElementById('back').addEventListener('click', () => {
            if (lose) resetBoard();
        }); 

        document.getElementById('menu').addEventListener('click', () => {
            let bombCount = document.getElementById('bomb_count');
            bombCount.innerText = numBombs;
            screen.classList.toggle("visible");
        });

        document.getElementById('close').addEventListener('click', () => {
            resetBoard();
            screen.classList.toggle("visible");
        });

        document.getElementById('minus').addEventListener('click', () => {
            let bombCount = document.getElementById('bomb_count');
            if (numBombs > 1) {
                numBombs--;
                bombCount.innerText = numBombs;
            }
        });

        document.getElementById('plus').addEventListener('click', () => {
            let bombCount = document.getElementById('bomb_count');
            if (numBombs < 24) {
                numBombs++;
                bombCount.innerText = numBombs;
            }
        });
        
        function play() {

            setTable();

            let i = 0;
            document.querySelectorAll('.cover').forEach(cover => {
                setTimeout(() => {
                    cover.classList.add('rise');
                }, 15 * i);
                i++;
            });

            document.querySelectorAll('.tile').forEach(tile => {
                let cover = tile.querySelector('.cover');
                let mine = tile.querySelector('.mine');
                let mineId = parseInt(mine.id);

                cover.addEventListener('click', () => {
                    if (clears == tiles - numBombs) lose = true;
                    if (!cleared[mineId] && !lose) {

                        cover.classList.add('clear');
                        mine.classList.add('reveal');
                        cleared[mineId] = true;
                        clears++;

                        if (bombs.includes(mineId)) {
                            mine.innerText = "💣";
                            setTimeout(() => {
                                endGame();
                            }, 450);
                        } else {
                            mine.innerText = "💎";
                            if (clears == tiles - numBombs) {
                                setTimeout(() => {
                                    endGame();
                                }, 550);
                            }
                        }
                    }
                });
            });
        }

        function endGame() {
            lose = true;

            instructions.innerText = "CLICK ANYWHERE TO RESET";

            document.querySelectorAll('.tile').forEach(tile => {
                let cover = tile.querySelector('.cover');
                let mine = tile.querySelector('.mine');
                let mineId = parseInt(mine.id);

                if (!cleared[mineId]) {
                    mine.classList.add('blurred');
                    cover.className = "";
                    cover.classList.add('clear');
                    cover.classList.add('cover');
                    
                    setTimeout(() => {
                        cover.classList.remove('clear');
                        cover.classList.add('translucent');
                    }, 550);

                    if (!bombs.includes(mineId) && !mine.innerText.includes("💎")) {
                        mine.innerText = "💎";
                    } else if (bombs.includes(mineId) && !mine.innerText.includes("💣")) {
                        mine.innerText = "💣";
                    }
                }
            });

        }

        function resetBoard() {
            setTable();
            dissolveBoard();
        }

        function clearClasses() {
            document.querySelectorAll('.tile').forEach(tile => {
                let cover = tile.querySelector('.cover');
                let mine = tile.querySelector('.mine');

                cover.className = "";
                mine.className = "";

                cover.classList.add('cover');
                mine.classList.add('mine');
            });
        }

        function dissolveBoard() {
            let i = 24;
            setTimeout(() => {
                document.querySelectorAll('.tile').forEach(tile => {
                    let cover = tile.querySelector('.cover');
                    let mine = tile.querySelector('.mine');
                    setTimeout(() => {
                        cover.className = "";
                        cover.classList.add('cover');
                        cover.classList.add('erase');

                        mine.className = "";
                        mine.classList.add('mine');
                        mine.classList.add('reveal');
                    }, 15 * i);
                    i--;
                });
            }, 0);
            setTimeout(() => {
                document.querySelectorAll('.cover').forEach(cover => {
                    setTimeout(() => {
                        cover.classList.add('rise');
                        cover.classList.remove('erase');
                    }, 15 * i);
                    i++;
                });
                document.querySelectorAll('.mine').forEach(mine => {
                    mine.innerText = mine.innerText = "";
                })
                clearClasses();
            }, 1250);

            instructions.classList.toggle("visible");
        }

    </script>
</body>
</html>
